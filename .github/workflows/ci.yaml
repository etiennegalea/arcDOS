name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ai-worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.2"
      - run: python -B -m unittest worker.test_server -v

  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ARCDOS_E2E_DEV_TOKEN: arcdos-browser-fixture-token-0000000000000000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --prefix apps/web --no-audit --no-fund
      - name: Install pinned Protobuf tools
        run: |
          bash scripts/install-codegen.sh
          echo "$PWD/.local-tools/bin" >> "$GITHUB_PATH"
      - name: Check the API schema and generated code
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          buf format --diff --exit-code
          buf lint
          if git cat-file -e "${BASE_SHA}:buf.yaml" 2>/dev/null; then
            buf breaking --against ".git#ref=${BASE_SHA}"
          else
            echo "No API schema in the baseline commit"
          fi
          buf generate
          generated_changes=$(git status --porcelain -- crates/protocol apps/web/src/lib/gen)
          if [[ -n "$generated_changes" ]]; then
            printf 'Generated bindings are out of date:\n%s\n' "$generated_changes"
            exit 1
          fi
      - name: Check Rust
        run: |
          rustup show
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace
      - name: Check the web client
        working-directory: apps/web
        run: |
          npm run lint
          npm run check
      - name: Build the Linux container
        run: docker build -f deploy/Dockerfile.server -t arcdos:ci .
      - name: Validate Authentik Compose configuration
        env:
          AUTHENTIK_POSTGRES_PASSWORD: fixture-password
          AUTHENTIK_SECRET_KEY: fixture-secret
          AUTHENTIK_HOSTNAME: auth.example.com
          ARCDOS_HOSTNAME: drive.example.com
          ARCDOS_ACME_EMAIL: ops@example.com
          ARCDOS_OIDC_ISSUER: https://auth.example.com/application/o/arcdos-web/
          ARCDOS_OIDC_CLIENT_ID: fixture-client
          ARCDOS_ANDROID_ISSUER: https://auth.example.com/application/o/arcdos-android/
          ARCDOS_ANDROID_CLIENT_ID: fixture-android
        run: |
          docker compose -f deploy/compose.authentik.yml config --quiet
          docker compose -f deploy/compose.production.yml -f deploy/compose.authentik-proxy.yml \
            -f deploy/compose.ai.yml -f deploy/compose.android.yml config --quiet
      - name: Start the container
        run: |
          mkdir "$RUNNER_TEMP/arcdos-data"
          sudo chown 10001:10001 "$RUNNER_TEMP/arcdos-data"
          printf '%s\n' "$ARCDOS_E2E_DEV_TOKEN" > "$RUNNER_TEMP/arcdos-token"
          chmod 0444 "$RUNNER_TEMP/arcdos-token"
          docker run --detach --name arcdos-ci --read-only --cap-drop=ALL \
            --security-opt=no-new-privileges --publish 127.0.0.1:8080:8080 \
            --mount "type=bind,source=$RUNNER_TEMP/arcdos-data,target=/data" \
            --mount "type=bind,source=$RUNNER_TEMP/arcdos-token,target=/run/arcdos-token,readonly" \
            -e ARCDOS_DATA_DIR=/data -e ARCDOS_DEV_TOKEN_FILE=/run/arcdos-token arcdos:ci
          for attempt in {1..30}; do
            if [[ "$(docker inspect --format '{{.State.Health.Status}}' arcdos-ci)" == healthy ]]; then
              exit 0
            fi
            sleep 1
          done
          docker inspect --format '{{json .State.Health}}' arcdos-ci
          exit 1
      - name: Exercise the browser file manager and binary RPC
        working-directory: apps/web
        env:
          ARCDOS_E2E_URL: http://127.0.0.1:8080
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Build and test the Android client
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          apps/android/gradlew -p apps/android --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Show container logs
        if: failure()
        run: docker logs arcdos-ci 2>/dev/null || true
      - name: Remove test container
        if: always()
        run: docker rm --force arcdos-ci >/dev/null 2>&1 || true
