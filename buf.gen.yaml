version: v2
clean: true
plugins:
  - local: protoc-gen-buffa
    out: crates/protocol/src/generated/buffa
    opt:
      - views=true
      - json=true
  - local: protoc-gen-buffa-packaging
    out: crates/protocol/src/generated/buffa
    strategy: all
  - local: protoc-gen-connect-rust
    out: crates/protocol/src/generated/connect
    opt:
      - buffa_module=crate::proto
  - local: protoc-gen-buffa-packaging
    out: crates/protocol/src/generated/connect
    strategy: all
    opt:
      - filter=services
  - local: [node, apps/web/node_modules/@bufbuild/protoc-gen-es/bin/protoc-gen-es]
    out: apps/web/src/lib/gen
    opt:
      - target=ts
  - protoc_builtin: java
    protoc_path: protoc
    out: gen/android
    opt:
      - lite
  - protoc_builtin: kotlin
    protoc_path: protoc
    out: gen/android
    opt:
      - lite
  - local: [java, -jar, .local-tools/bin/protoc-gen-connect-kotlin-0.10.0.jar]
    out: gen/android
