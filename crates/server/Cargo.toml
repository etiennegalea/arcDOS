[package]
name = "arcdos-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
arcdos-protocol.workspace = true
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
connectrpc = { workspace = true, features = ["axum"] }
tokio = { version = "=1.54.1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tower-http = { version = "=0.7.1", features = ["fs"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "json"] }

[target.'cfg(target_os = "linux")'.dependencies]
arcdos-filesystem = { path = "../filesystem" }
arcdos-transfers = { path = "../transfers" }
base64 = "=0.22.1"
buffa-types.workspace = true
futures-util = { version = "=0.3.34", default-features = false }
rusqlite = { version = "=0.41.1", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
subtle = "=2.6.1"
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", features = ["fs", "io-util", "sync"] }
tokio-util = { version = "=0.7.20", features = ["io"] }
uuid = { version = "=1.29.2", features = ["v4"] }

[dev-dependencies]
buffa.workspace = true
tempfile = "=3.27.0"
tower = { version = "=0.5.3", features = ["util"] }

[lints]
workspace = true
