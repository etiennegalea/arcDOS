[package]
name = "arcdos-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
arcdos-protocol.workspace = true
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
connectrpc = { workspace = true, features = ["axum"] }
tokio = { version = "=1.54.1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tower-http = { version = "=0.7.1", features = ["fs"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "json"] }

[dev-dependencies]
buffa.workspace = true
tempfile = "=3.27.0"
tower = { version = "=0.5.3", features = ["util"] }

[lints]
workspace = true
