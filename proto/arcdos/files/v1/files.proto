syntax = "proto3";

package arcdos.files.v1;

import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_package = "io.arcdos.files.v1";

// FileService manages metadata and mutations on the shared filesystem.
service FileService {
  rpc GetEntry(GetEntryRequest) returns (GetEntryResponse) {}
  rpc ListEntries(ListEntriesRequest) returns (ListEntriesResponse) {}
  rpc CreateDirectory(CreateDirectoryRequest) returns (CreateDirectoryResponse) {}
  rpc MoveEntry(MoveEntryRequest) returns (MoveEntryResponse) {}
  rpc CopyEntry(CopyEntryRequest) returns (CopyEntryResponse) {}
  rpc TrashEntry(TrashEntryRequest) returns (TrashEntryResponse) {}
  rpc RestoreEntry(RestoreEntryRequest) returns (RestoreEntryResponse) {}
  rpc ListTrash(ListTrashRequest) returns (ListTrashResponse) {}
  rpc ListChanges(ListChangesRequest) returns (ListChangesResponse) {}
}

// TransferService manages resumable uploads. File bytes use separate HTTP endpoints.
service TransferService {
  rpc BeginUpload(BeginUploadRequest) returns (BeginUploadResponse) {}
  rpc GetUpload(GetUploadRequest) returns (GetUploadResponse) {}
  rpc CommitUpload(CommitUploadRequest) returns (CommitUploadResponse) {}
  rpc CancelUpload(CancelUploadRequest) returns (CancelUploadResponse) {}
}

enum EntryKind {
  ENTRY_KIND_UNSPECIFIED = 0;
  ENTRY_KIND_FILE = 1;
  ENTRY_KIND_DIRECTORY = 2;
}

// Entry describes a file or directory using a server-issued opaque identity.
message Entry {
  string entry_id = 1;
  string parent_id = 2;
  string name = 3;
  EntryKind kind = 4;
  uint64 size_bytes = 5;
  string revision = 6;
  google.protobuf.Timestamp modified_at = 7;
  bool trashed = 8;
}

message GetEntryRequest {
  // Omit to retrieve the storage root.
  string entry_id = 1;
}

message GetEntryResponse {
  Entry entry = 1;
}

message ListEntriesRequest {
  // Omit to list the storage root.
  string parent_id = 1;
  uint32 page_size = 2;
  string page_token = 3;
}

message ListEntriesResponse {
  repeated Entry entries = 1;
  // Present when more entries can be requested for the same parent.
  string next_page_token = 2;
}

message CreateDirectoryRequest {
  string parent_id = 1;
  string name = 2;
  string expected_parent_revision = 3;
}

message CreateDirectoryResponse {
  Entry entry = 1;
}

// MoveEntryRequest renames or moves an entry without replacing an existing one.
message MoveEntryRequest {
  string entry_id = 1;
  string expected_revision = 2;
  string destination_parent_id = 3;
  string name = 4;
  string expected_parent_revision = 5;
}

message MoveEntryResponse {
  Entry entry = 1;
}

// CopyEntryRequest creates a new copy of a file without replacing an existing entry.
message CopyEntryRequest {
  string entry_id = 1;
  string expected_revision = 2;
  string destination_parent_id = 3;
  string name = 4;
  string expected_parent_revision = 5;
}

message CopyEntryResponse {
  Entry entry = 1;
}

message TrashEntryRequest {
  string entry_id = 1;
  string expected_revision = 2;
}

message TrashEntryResponse {
  Entry entry = 1;
}

// RestoreEntryRequest returns a trashed entry to its original parent and name.
message RestoreEntryRequest {
  string entry_id = 1;
  string expected_revision = 2;
}

message RestoreEntryResponse {
  Entry entry = 1;
}

message ListTrashRequest {
  uint32 page_size = 1;
  string page_token = 2;
}

message ListTrashResponse {
  repeated Entry entries = 1;
  string next_page_token = 2;
}

enum ChangeKind {
  CHANGE_KIND_UNSPECIFIED = 0;
  CHANGE_KIND_CREATED = 1;
  CHANGE_KIND_MOVED = 2;
  CHANGE_KIND_COPIED = 3;
  CHANGE_KIND_TRASHED = 4;
  CHANGE_KIND_RESTORED = 5;
  CHANGE_KIND_UPLOADED = 6;
}

message Change {
  uint64 sequence = 1;
  string entry_id = 2;
  ChangeKind kind = 3;
  google.protobuf.Timestamp occurred_at = 4;
}

message ListChangesRequest {
  // Return journal entries with a sequence greater than this value.
  uint64 after_sequence = 1;
  uint32 page_size = 2;
}

message ListChangesResponse {
  repeated Change changes = 1;
  // Last returned sequence, or the request's cursor when there are no changes.
  uint64 next_sequence = 2;
}

message Upload {
  string upload_id = 1;
  uint64 size_bytes = 2;
  // Bytes durably received. Continue the upload from this offset.
  uint64 committed_offset = 3;
}

message BeginUploadRequest {
  string parent_id = 1;
  string name = 2;
  string expected_parent_revision = 3;
  uint64 size_bytes = 4;
  // Raw 32-byte SHA-256 digest of the entire file.
  bytes sha256 = 5;
}

message BeginUploadResponse {
  Upload upload = 1;
}

message GetUploadRequest {
  string upload_id = 1;
}

message GetUploadResponse {
  Upload upload = 1;
}

message CommitUploadRequest {
  string upload_id = 1;
  // Omit to use the parent revision supplied when beginning the upload.
  string expected_parent_revision = 2;
}

message CommitUploadResponse {
  Entry entry = 1;
}

message CancelUploadRequest {
  string upload_id = 1;
}

message CancelUploadResponse {}
